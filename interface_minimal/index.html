<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Parakeet Minimal Interface</title>
  <style>
    :root {
      --bg: #f6f7fb;
      --card: #ffffff;
      --text: #0f172a;
      --muted: #475569;
      --line: #dbe2ea;
      --ok: #0f766e;
      --warn: #b45309;
      --danger: #b91c1c;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
      min-height: 100vh;
      display: grid;
      place-items: start center;
      padding: 24px 12px;
    }

    .card {
      width: min(780px, 100%);
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 16px;
    }

    h1 {
      margin: 0 0 12px;
      font-size: 20px;
      font-weight: 700;
    }

    .row {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 10px;
    }

    input[type="text"] {
      width: 100%;
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 10px;
      color: var(--text);
      background: #fff;
      font-size: 14px;
    }

    button {
      border: 0;
      border-radius: 8px;
      padding: 10px 14px;
      font-size: 14px;
      cursor: pointer;
      color: #fff;
    }

    #startBtn { background: var(--ok); }
    #stopBtn { background: var(--danger); }
    #resetBtn { background: #334155; }
    #clearBtn { background: #475569; }

    #status {
      border-radius: 8px;
      padding: 10px;
      background: #e2e8f0;
      color: var(--muted);
      font-size: 13px;
      margin-bottom: 10px;
      min-height: 40px;
      display: flex;
      align-items: center;
    }

    #out {
      border: 1px solid var(--line);
      border-radius: 8px;
      min-height: 180px;
      padding: 12px;
      white-space: pre-wrap;
      line-height: 1.45;
      background: #fafafa;
    }

    .hint {
      margin-top: 10px;
      font-size: 12px;
      color: var(--muted);
    }
  </style>
</head>
<body>
  <main class="card">
    <h1>Parakeet STT Minimal Interface</h1>

    <div class="row">
      <input id="wsUrl" type="text" value="ws://46.4.50.248:8001/ws/parakeet-stt" />
    </div>

    <div class="row">
      <button id="startBtn">Start Mic</button>
      <button id="stopBtn" disabled>Stop + Flush</button>
      <button id="resetBtn" disabled>Reset Server Buffer</button>
      <button id="clearBtn">Clear Text</button>
    </div>

    <div id="status">Idle</div>
    <div id="out"></div>
    <p class="hint">Use on localhost (for mic permission), e.g. http://127.0.0.1:8080.</p>
  </main>

  <script>
    const wsUrlEl = document.getElementById("wsUrl");
    const startBtn = document.getElementById("startBtn");
    const stopBtn = document.getElementById("stopBtn");
    const resetBtn = document.getElementById("resetBtn");
    const clearBtn = document.getElementById("clearBtn");
    const statusEl = document.getElementById("status");
    const outEl = document.getElementById("out");

    let ws = null;
    let stream = null;
    let audioContext = null;
    let source = null;
    let processor = null;

    function setStatus(text) {
      statusEl.textContent = text;
    }

    function appendText(text) {
      if (!text) return;
      outEl.textContent = outEl.textContent
        ? outEl.textContent + " " + text
        : text;
    }

    function float32ToPCM16Buffer(float32Array) {
      const pcm16 = new Int16Array(float32Array.length);
      for (let i = 0; i < float32Array.length; i += 1) {
        const s = Math.max(-1, Math.min(1, float32Array[i]));
        pcm16[i] = s < 0 ? s * 0x8000 : s * 0x7fff;
      }
      return pcm16.buffer;
    }

    function updateButtons(isStreaming) {
      startBtn.disabled = isStreaming;
      stopBtn.disabled = !isStreaming;
      resetBtn.disabled = !isStreaming;
      wsUrlEl.disabled = isStreaming;
    }

    async function startMic() {
      const wsUrl = wsUrlEl.value.trim();
      if (!wsUrl) {
        setStatus("Set WS URL first.");
        return;
      }

      setStatus("Requesting microphone...");
      stream = await navigator.mediaDevices.getUserMedia({ audio: true, video: false });

      ws = new WebSocket(wsUrl);
      ws.binaryType = "arraybuffer";

      ws.onopen = async () => {
        setStatus("WS connected. Streaming mic...");
        audioContext = new (window.AudioContext || window.webkitAudioContext)({ sampleRate: 16000 });
        source = audioContext.createMediaStreamSource(stream);
        processor = audioContext.createScriptProcessor(4096, 1, 1);

        processor.onaudioprocess = (event) => {
          if (!ws || ws.readyState !== WebSocket.OPEN) return;
          const input = event.inputBuffer.getChannelData(0);
          ws.send(float32ToPCM16Buffer(input));
        };

        source.connect(processor);
        processor.connect(audioContext.destination);
        updateButtons(true);
      };

      ws.onmessage = (event) => {
        try {
          const msg = JSON.parse(event.data);
          if (msg.type === "ready") {
            setStatus("Server ready.");
          } else if ((msg.type === "transcription" || msg.type === "partial") && msg.text) {
            appendText(msg.text);
            setStatus("Transcript updated.");
          } else if (msg.type === "flushed") {
            setStatus("Flush complete.");
          } else if (msg.type === "reset_ack") {
            setStatus("Server buffer reset.");
          } else if (msg.type === "error") {
            setStatus("Server error: " + (msg.detail || JSON.stringify(msg)));
          }
        } catch (_) {
          // ignore non-json
        }
      };

      ws.onerror = () => setStatus("WebSocket error.");
      ws.onclose = () => {
        setStatus("Disconnected.");
        updateButtons(false);
      };
    }

    async function stopMic() {
      if (processor) processor.disconnect();
      if (source) source.disconnect();
      if (audioContext) await audioContext.close();
      if (stream) stream.getTracks().forEach((t) => t.stop());

      if (ws && ws.readyState === WebSocket.OPEN) {
        ws.send("flush");
        setStatus("Flushing transcript...");
        setTimeout(() => {
          if (ws && ws.readyState === WebSocket.OPEN) ws.close();
        }, 1500);
      } else if (ws) {
        ws.close();
      }

      processor = null;
      source = null;
      audioContext = null;
      stream = null;
    }

    function resetServerBuffer() {
      if (ws && ws.readyState === WebSocket.OPEN) {
        ws.send("reset");
      }
    }

    startBtn.addEventListener("click", () => {
      startMic().catch((err) => {
        setStatus("Start failed: " + err.message);
        updateButtons(false);
      });
    });

    stopBtn.addEventListener("click", () => {
      stopMic().catch((err) => setStatus("Stop failed: " + err.message));
    });

    resetBtn.addEventListener("click", resetServerBuffer);
    clearBtn.addEventListener("click", () => { outEl.textContent = ""; });
  </script>
</body>
</html>
